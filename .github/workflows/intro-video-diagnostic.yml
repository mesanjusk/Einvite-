name: Intro Video Build Diagnostic
on:
  push:
    branches:
      - fix/intro-video-build

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/einvite
      AUTH_SECRET: diagnostic-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
