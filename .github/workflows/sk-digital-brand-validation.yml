name: SK Digital Royal Brand Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/einvite
      AUTH_SECRET: sk-digital-brand-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run --exclude src/lib/actions/invitation.integration.test.ts
      - run: npx next build --turbopack
