services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - studio_mongodata:/data/db
    healthcheck:
      # Prisma's MongoDB connector requires the server to report itself as
      # a replica set (even a single-node one) — this auto-initiates rs0
      # on first boot and reports healthy once it's either already
      # initiated or successfully just was.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "mongodb://db:27017/wedding_studio?replicaSet=rs0"
    ports:
      - "3000:3000"

volumes:
  studio_mongodata:
